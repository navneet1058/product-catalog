<div class="card">
    <span class="category">{{ product.category }}</span>
    <h3>
        <a [routerLink]="['/product', product.id]">{{ product.name }}</a>
    </h3>
    <p class="price">{{ product.price | currency }}</p>
    <button
        [disabled]="!product.inStock"
        (click)="addToCart.emit(product)">
        Add to cart
    </button>
</div>
